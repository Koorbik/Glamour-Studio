spring.datasource.url=jdbc:postgresql://make_up_service_db:5432/make_up_service_db
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# JWT secret key
security.jwt.secret-key =${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION}

# Mail properties
spring.mail.host=smtp.mailgun.org
spring.mail.port=587
spring.mail.username=${MAILGUN_LOGIN}
spring.mail.password=${MAILGUN_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.config.import=optional:file:.env[.properties]

# Actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Google Calendar OAuth2 Configuration
google.calendar.client.id=${GOOGLE_CALENDAR_CLIENT_ID}
google.calendar.client.secret=${GOOGLE_CALENDAR_SECRET}
google.calendar.redirect.uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/auth/google/callback}
google.calendar.scopes=https://www.googleapis.com/auth/calendar
google.calendar.access.type=offline

google.auth.client.id=${GOOGLE_AUTH_CLIENT_ID}
google.auth.frontend.client.id=${GOOGLE_AUTH_FRONTEND_CLIENT_ID}

# PayU Configuration
payu.base-url=${PAYU_BASE_URL}
payu.oauth.client-id=${PAYU_OAUTH_CLIENT_ID}
payu.oauth.client-secret=${PAYU_OAUTH_CLIENT_SECRET}
payu.pos-id=${PAYU_POS_ID}
payu.second-key-md5=${PAYU_SECOND_KEY_MD5}

# URL where PayU redirects the user AFTER payment (Frontend URL)
# For Docker + ngrok, set PAYU_CONTINUE_URL env variable to your ngrok frontend URL
payu.continue-url=${PAYU_CONTINUE_URL:http://localhost:4200/dashboard}

# URL for background notifications - MUST be publicly accessible for PayU webhooks
# For Docker + ngrok, set PAYU_NOTIFY_URL env variable to your ngrok backend URL
# Example: https://your-backend-id.ngrok-free.app/api/payments/notify
payu.notify-url=${PAYU_NOTIFY_URL:http://localhost:8080/api/payments/notify}

zoho.client.id=${ZOHO_CLIENT_ID}
zoho.client.secret=${ZOHO_CLIENT_SECRET}
zoho.refresh.token=${ZOHO_REFRESH_TOKEN}
zoho.organization.id=${ZOHO_ORGANIZATION_ID}
zoho.api.base.url=https://www.zohoapis.eu/invoice/v3
zoho.auth.url=https://accounts.zoho.eu/oauth/v2/token
zoho.generic.customer.id=${ZOHO_GENERIC_CUSTOMER_ID}
